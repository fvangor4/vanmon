<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>VanMon</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d2b3a;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      /* iOS Safari ignores user-scalable=no; touch-action is what blocks pinch/double-tap zoom. */
      #game,
      #game canvas {
        touch-action: none;
      }
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      // iOS Safari still fires pinch-zoom gestures; cancel them so little fingers can't zoom the page.
      document.addEventListener('gesturestart', (e) => e.preventDefault());
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
